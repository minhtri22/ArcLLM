name: arcllm-v1-phase2-direct-execution-holdout

on:
  push:
    branches: [research/arcllm-v1]
    paths:
      - 'config/arcllm_v1_phase2_direct_execution_holdout_generalization_gate_v0.1.json'
      - 'tests/arcllm_v1_direct_execution_holdout_generalization_gate.cpp'
      - 'tests/test_arcllm_v1_direct_execution_holdout_generalization_gate_static.py'
      - '.github/workflows/arcllm-v1-phase2-direct-execution-holdout.yml'
  workflow_dispatch:

jobs:
  zero-science:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test_arcllm_v1_direct_execution_holdout_generalization_gate_static.py
      - run: g++ -std=c++17 -O2 -Wall -Wextra -pedantic -Iinclude -Isrc tests/arcllm_v1_direct_execution_holdout_generalization_gate.cpp src/arcllm_v1_generic_policy_engine_v2.cpp src/arcllm_v1_primitive_registry_v2.cpp -o /tmp/arcllm_direct_holdout
      - run: /tmp/arcllm_direct_holdout
