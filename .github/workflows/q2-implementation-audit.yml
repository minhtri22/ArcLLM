name: Q2 Implementation Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/q2-implementation-audit.yml"
      - "src/q2_benchmark.cpp"
      - "src/p8c_segmented_access_correctness.cpp"
      - "src/gguf.cpp"
      - "src/gguf.h"
      - "src/tensor_store.cpp"
      - "src/tensor_store.h"
      - "baseline/q2_llama_adapter.cpp"
      - "baseline/CMakeLists.txt"
      - "tools/compile_q2_shaders.ps1"
      - "tools/build_q2.ps1"
      - "tools/qualify_q2_baseline.ps1"
      - "tools/q2_resource_sampler.py"
      - "tools/q2_gpu_sampler.ps1"
      - "tools/summarize_q2.py"
      - "run_q2_preflight.ps1"
      - "run_q2.ps1"
      - "tests/test_q2_package.py"
      - "config/q2_workloads.json"
      - "docs/Q2_MATCHED_BENCHMARK_CONTRACT.md"
      - "docs/Q2_IMPLEMENTATION.md"
      - "manifest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q2-arcllm-buildonly:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static package contract
        shell: pwsh
        run: py -3 tests/test_q2_package.py

      - name: Compile pinned Q2 shaders
        shell: pwsh
        run: powershell.exe -ExecutionPolicy Bypass -File tools\compile_q2_shaders.ps1

      - name: Native Windows build
        shell: pwsh
        run: powershell.exe -ExecutionPolicy Bypass -File tools\build_q2.ps1

      - name: Assert executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path .\arcllm_q2.exe)) { throw "arcllm_q2.exe missing" }
          Get-Item .\arcllm_q2.exe | Select-Object Name,Length,LastWriteTime

      - name: Upload ArcLLM BuildOnly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q2-arcllm-buildonly-${{ github.sha }}
          if-no-files-found: warn
          path: |
            results/q2_arcllm_shader_provenance.json
            arcllm_q2.exe
