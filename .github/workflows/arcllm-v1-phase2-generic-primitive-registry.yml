name: arcllm-v1-phase2-generic-primitive-registry

on:
  push:
    branches: [research/arcllm-v1]
    paths:
      - 'include/arcllm/v1/primitive_registry_model.h'
      - 'include/arcllm/v1/primitive_registry_api.h'
      - 'src/arcllm_v1_primitive_registry.cpp'
      - 'src/registrations/arcllm_v1_q4k_down_reference_registration.*'
      - 'tests/arcllm_v1_generic_primitive_registry_zero_science.cpp'
      - 'tests/test_arcllm_v1_generic_primitive_registry_static.py'
      - 'config/arcllm_v1_phase2_generic_primitive_registry_contract_v0.1.json'
      - '.github/workflows/arcllm-v1-phase2-generic-primitive-registry.yml'
  workflow_dispatch:

jobs:
  zero-science:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test_arcllm_v1_generic_primitive_registry_static.py
      - run: g++ -std=c++17 -O2 -Wall -Wextra -pedantic -Iinclude -Isrc tests/arcllm_v1_generic_primitive_registry_zero_science.cpp src/arcllm_v1_primitive_registry.cpp src/registrations/arcllm_v1_q4k_down_reference_registration.cpp -o /tmp/arcllm_registry
      - run: /tmp/arcllm_registry
