name: Token-XRay R1R Static Preflight

on:
  push:
    branches:
      - research/token-xray-r1r-execution-integrity-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python -m py_compile tools/run_token_xray_r1r_one_shot.py
      - name: R1R static contract audit
        run: python tests/test_token_xray_r1r_execution_integrity_static.py
      - name: Prove capture math and hooks unchanged from consumed R1 freeze
        shell: bash
        run: |
          test -z "$(git diff --name-only 3e1b86ceb5fad8b423dfa8f8bbb46760d0f15328 -- src include shaders | tr -d '\n')"
          echo "R1R_CAPTURE_RUNTIME_DELTA=0"
      - name: Confirm native build authority remains target machine
        run: |
          echo "Native tokenizer/harness/shader build is target-machine implementation preflight, not GitHub science."
