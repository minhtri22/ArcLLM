name: arcllm-v1-b1-policy-zero-science

on:
  push:
    branches:
      - research/arcllm-v1
    paths:
      - 'src/arcllm_v1_b1_policy.h'
      - 'src/arcllm_v1_b1_policy_runtime_hook.h'
      - 'tests/arcllm_v1_b1_policy_zero_science.cpp'
      - 'tests/test_arcllm_v1_b1_policy_static.py'
      - 'config/arcllm_v1_b1_selection_lifetime_policy_v0.2.json'
      - '.github/workflows/arcllm-v1-b1-policy-zero-science.yml'
  workflow_dispatch:

jobs:
  zero-science:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static policy contract QA
        run: python3 tests/test_arcllm_v1_b1_policy_static.py
      - name: Compile portable policy evaluator
        run: g++ -std=c++17 -O2 -Wall -Wextra -pedantic tests/arcllm_v1_b1_policy_zero_science.cpp -o /tmp/arcllm_v1_b1_policy_zero_science
      - name: Exhaustive zero-science transition QA
        run: /tmp/arcllm_v1_b1_policy_zero_science
