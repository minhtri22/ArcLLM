name: Token-XRay R1 Static and Tokenization Preflight

on:
  push:
    branches:
      - research/token-xray-r1-representation-capture
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install zero-science tokenizer/static dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "huggingface_hub==0.26.5" "tokenizers==0.20.3" pytest

      - name: Freeze P0-P3 upstream reference token IDs
        run: |
          mkdir -p r1-preflight
          python tools/token_xray_r1_freeze_token_ids.py --out r1-preflight/R1_REFERENCE_TOKENIZATION.json

      - name: R1 static hook audit
        run: |
          python tests/test_token_xray_r1_representation_capture_static.py

      - name: Compile R1 capture shader
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          glslangValidator -V --target-env vulkan1.2 -S comp             -o /tmp/token_xray_r1_capture_row.spv             shaders/token_xray_r1_capture_row.comp

      - name: Upload zero-science preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: token-xray-r1-static-preflight
          path: r1-preflight/R1_REFERENCE_TOKENIZATION.json
          if-no-files-found: error
          retention-days: 90


  windows-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Syntax-check R1 runtime and harness
        shell: cmd
        run: |
          cl.exe /nologo /std:c++17 /EHsc /W4 /Zs src\arcllm_v1_runtime.cpp
          cl.exe /nologo /std:c++17 /EHsc /W4 /Zs src\token_xray_r1_capture_harness.cpp

      - name: Native-link R1 capture harness
        shell: cmd
        run: |
          cl.exe /nologo /std:c++17 /O2 /EHsc /W4 /bigobj /Fe:token_xray_r1_capture_harness.exe ^
            src\arcllm_v1_runtime.cpp ^
            src\token_xray_r1_capture_harness.cpp ^
            src\gguf.cpp ^
            src\tensor_store.cpp ^
            src\arcllm_v1_primitive_registry_v2.cpp ^
            src\arcllm_v1_generic_policy_engine_v4.cpp ^
            src\arcllm_v1_generic_backend_binding_v4.cpp ^
            src\registrations\arcllm_v1_q4k_down_reference_registration_v2.cpp

      - name: Confirm no model execution
        shell: powershell
        run: |
          Write-Host "TOKEN_XRAY_R1_WINDOWS_SYNTAX=PASS"
          Write-Host "MODEL_EXECUTION=false"


  tokenizer-probe-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned llama.cpp
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          git -C /tmp/llama.cpp fetch --force --depth 1 origin b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          git -C /tmp/llama.cpp checkout --detach b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          test "$(git -C /tmp/llama.cpp rev-parse HEAD)" = "b29c606e28a01b1bc8c1351026a0fa6e616bf6c4"

      - name: Build exact-GGUF tokenizer probe
        run: |
          cmake -S baseline/r1_tokenizer -B /tmp/r1tok             -DLLAMA_CPP_DIR=/tmp/llama.cpp             -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/r1tok --target token_xray_r1_tokenizer_probe -j2

      - name: Confirm build-only boundary
        run: |
          test -x /tmp/r1tok/token_xray_r1_tokenizer_probe
          echo "TOKEN_XRAY_R1_TOKENIZER_PROBE_BUILD=PASS"
          echo "MODEL_EXECUTION=false"
